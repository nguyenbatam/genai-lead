# The env file stays on the host and is injected when the container starts.
# It is not copied into the image.
#   ENV_FILE=/absolute/path/.env docker compose --env-file "$ENV_FILE" up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: genai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai -d genai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  tools:
    build: .
    command: ["python", "-m", "apps.tools.main"]
    ports:
      - "${TOOLS_PORT:-8081}:8081"
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      TOOLS_TOKEN: ${TOOLS_TOKEN:?set TOOLS_TOKEN}
      TOOLS_PORT: "8081"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
      - "127.0.0.1:${METRICS_PORT:-9100}:9100"
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: postgresql://genai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/genai
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:?set PLATFORM_ADMIN_TOKEN}
      PLATFORM_KEY_PEPPER: ${PLATFORM_KEY_PEPPER:?set PLATFORM_KEY_PEPPER}
      METRICS_PORT: "9100"
      OBJECT_STORAGE_DIR: ${OBJECT_STORAGE_DIR:-/tmp/genai-blobs}
      LLM_CREDENTIALS_FILE: ${LLM_CREDENTIALS_FILE:-config/llm_credentials.yaml}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      TOOLS_URL: http://tools:8081
      TOOLS_TOKEN: ${TOOLS_TOKEN:?set TOOLS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      tools:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "apps.workers.main"]
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: postgresql://genai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/genai
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:?set PLATFORM_ADMIN_TOKEN}
      PLATFORM_KEY_PEPPER: ${PLATFORM_KEY_PEPPER:?set PLATFORM_KEY_PEPPER}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      OBJECT_STORAGE_DIR: ${OBJECT_STORAGE_DIR:-/tmp/genai-blobs}
      LLM_CREDENTIALS_FILE: ${LLM_CREDENTIALS_FILE:-config/llm_credentials.yaml}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      TOOLS_URL: http://tools:8081
      TOOLS_TOKEN: ${TOOLS_TOKEN:?set TOOLS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      tools:
        condition: service_healthy

  # Opt-in self-host LLM. Does not start with plain `compose up`.
  #   docker compose --profile local-llm up
  # Pull a model once: docker compose --profile local-llm exec llm-local ollama pull llama3.2
  llm-local:
    image: ollama/ollama:0.6.5
    profiles: ["local-llm"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - llm_local_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  llm_local_data:
