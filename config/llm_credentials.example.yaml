# Copy to config/llm_credentials.yaml (gitignored) and set the env vars named below.
# Keys stay in the environment; this file only describes pool policy.
#
#   cp config/llm_credentials.example.yaml config/llm_credentials.yaml
#   set -a && source .env && set +a
#
# Override path with LLM_CREDENTIALS_FILE. Inline LLM_CREDENTIALS JSON wins if set.
# Pick order (when model.tier_affinity=any): free_paid_local (default) or free_local_paid.
# Model card or route may set tier_order. Affinity free_only / paid_only still wins.
#
# HttpModel speaks OpenAI-compatible /chat/completions only.
# Prefer openrouter, groq, cerebras, mistral, openai, gemini (openai path) for live bench.
# Native Anthropic Messages (api.anthropic.com) is not compatible — route via OpenRouter
# or skip in config/model_catalog.yaml (live: false).

credentials:
  - id: or-free-01
    provider: openrouter
    tier: free
    api_key_env: OR_KEY_01
    base_url: https://openrouter.ai/api/v1
    weight: 1
    limits:
      - { period: 1m, unit: requests, max: 20, window: rolling }
      - { period: 1d, unit: requests, max: 50, window: calendar }

  - id: or-free-02
    provider: openrouter
    tier: free
    api_key_env: OR_KEY_02
    base_url: https://openrouter.ai/api/v1
    weight: 1
    limits:
      - { period: 7d, unit: requests, max: 200, window: calendar }

  - id: or-paid-01
    provider: openrouter
    tier: paid
    api_key_env: OR_PAID
    base_url: https://openrouter.ai/api/v1
    weight: 1
    limits:
      - { period: 1m, unit: requests, max: 200, window: rolling }
      - { period: 1d, unit: spend_usd, max: 20, window: calendar }

  # Self-host (Compose profile local-llm). Same OpenAI-compatible adapter.
  - id: local-ollama
    provider: selfhost
    tier: local
    api_key_env: LOCAL_LLM_KEY
    base_url: http://llm-local:11434/v1
    weight: 1
    limits:
      - { period: 1m, unit: requests, max: 30, window: rolling }
